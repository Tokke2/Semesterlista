<!doctype html>
<html lang="sv">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="theme-init.js"></script>
    <title>Sida till PDF</title>
    <link rel="stylesheet" href="ui.css" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body class="popup">
    <header class="popup-header">
      <img class="app-icon" src="../icons/icon48.png" width="34" height="34" alt="" />
      <div class="titles">
        <h1 data-i18n="appName">Sida till PDF</h1>
        <p class="muted" data-i18n="popup.subtitle">Valda webbplatser, ett klick</p>
      </div>
      <button
        id="open-options"
        class="icon-btn"
        type="button"
        data-i18n-title="popup.settings"
        data-i18n-aria-label="popup.settings"
        title="Inställningar"
      >
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.7" />
          <path
            d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6h.09A1.65 1.65 0 0 0 10 3.09V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"
            stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"
          />
        </svg>
      </button>
    </header>

    <section class="site-card" aria-live="polite">
      <div class="site-row">
        <span id="status-dot" class="status-dot" aria-hidden="true"></span>
        <div class="site-text">
          <strong id="site-name" class="site-name">…</strong>
          <span id="status-pill" class="pill">…</span>
        </div>
      </div>
      <p id="hint" class="hint"></p>
    </section>

    <div id="banner" class="banner" role="status" aria-live="polite" hidden></div>
    <div id="banner-actions" class="banner-actions" hidden>
      <button id="open-pdf" class="link link-with-icon" type="button">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M14 4h6v6M20 4l-9 9" stroke="currentColor" stroke-width="1.8"
                stroke-linecap="round" stroke-linejoin="round" />
          <path d="M18 14.5V19a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2h4.5"
                stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
        </svg>
        <span data-i18n="popup.openPdf">Öppna PDF</span>
      </button>
      <button id="show-folder" class="link link-with-icon" type="button">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M3 8a2 2 0 0 1 2-2h3.9a2 2 0 0 1 1.6.8l1 1.2H19a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8Z"
                stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" />
        </svg>
        <span data-i18n="popup.showInFolder">Visa i mapp</span>
      </button>
    </div>

    <button id="primary" class="btn btn-primary btn-block" type="button">
      <span id="primary-label" data-i18n="popup.save">Spara som PDF</span>
    </button>

    <button id="secondary" class="btn btn-ghost btn-block" type="button" hidden></button>

    <div class="option-row">
      <div class="option-text">
        <span class="option-label" data-i18n="popup.saveAs">Fråga var filen ska sparas</span>
        <span id="save-as-note" class="option-note" data-i18n="popup.saveAsHint">Du väljer mapp i webbläsarens dialog.</span>
      </div>
      <label class="switch">
        <input id="save-as" type="checkbox" />
        <span class="track"></span>
        <span class="sr-only" data-i18n="popup.saveAs"></span>
      </label>
    </div>

    <div class="filename-row">
      <span class="muted" data-i18n="popup.filename">Filnamn</span>
      <span id="filename-preview" class="filename-value">…</span>
    </div>

    <div class="last-saved">
      <span class="muted" data-i18n="popup.lastSaved">Senast sparad</span>
      <span id="last-saved" class="last-file">–</span>
    </div>

    <footer class="popup-footer">
      <span id="shortcut" class="muted"></span>
      <button id="settings-link" class="link" type="button" data-i18n="popup.settings">Inställningar</button>
    </footer>

    <script type="module" src="popup.js"></script>
  </body>
</html>
