<!doctype html>
<html lang="sv">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sida till PDF</title>
    <link rel="stylesheet" href="ui.css" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body class="popup">
    <header class="popup-header">
      <img class="app-icon" src="../icons/icon48.png" width="34" height="34" alt="" />
      <div class="titles">
        <h1 data-i18n="appName">Sida till PDF</h1>
        <p class="muted" data-i18n="popup.subtitle">Valda webbplatser, ett klick</p>
      </div>
      <button
        id="open-options"
        class="icon-btn"
        type="button"
        data-i18n-title="popup.settings"
        data-i18n-aria-label="popup.settings"
        title="Inställningar"
      >
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path
            d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z"
            stroke="currentColor"
            stroke-width="1.7"
          />
          <path
            d="M19.4 13.5c.1-.5.1-1 .1-1.5s0-1-.1-1.5l1.7-1.2-1.7-3-2 .8c-.8-.6-1.6-1-2.5-1.3L14.5 3h-3.4l-.4 2.3c-.9.3-1.7.7-2.5 1.3l-2-.8-1.7 3 1.7 1.2c-.1.5-.1 1-.1 1.5s0 1 .1 1.5l-1.7 1.2 1.7 3 2-.8c.8.6 1.6 1 2.5 1.3l.4 2.3h3.4l.4-2.3c.9-.3 1.7-.7 2.5-1.3l2 .8 1.7-3-1.7-1.2Z"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linejoin="round"
          />
        </svg>
      </button>
    </header>

    <section class="site-card" aria-live="polite">
      <div class="site-row">
        <span id="status-dot" class="status-dot" aria-hidden="true"></span>
        <div class="site-text">
          <strong id="site-name" class="site-name">…</strong>
          <span id="status-pill" class="pill">…</span>
        </div>
      </div>
      <p id="hint" class="hint"></p>
    </section>

    <div id="banner" class="banner" role="status" aria-live="polite" hidden></div>

    <button id="primary" class="btn btn-primary btn-block" type="button">
      <svg id="primary-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path
          d="M6 3h8l5 5v13a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"
          stroke="currentColor"
          stroke-width="1.7"
          stroke-linejoin="round"
        />
        <path d="M14 3v5h5" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" />
        <path
          d="M12 11v7m0 0-3-3m3 3 3-3"
          stroke="currentColor"
          stroke-width="1.7"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
      <span id="primary-label" data-i18n="popup.save">Spara som PDF</span>
    </button>

    <button id="secondary" class="btn btn-ghost btn-block" type="button" hidden></button>

    <div class="last-saved">
      <span class="muted" data-i18n="popup.lastSaved">Senast sparad</span>
      <span id="last-saved" class="last-file">–</span>
    </div>

    <footer class="popup-footer">
      <span id="shortcut" class="muted"></span>
      <button id="settings-link" class="link" type="button" data-i18n="popup.settings">Inställningar</button>
    </footer>

    <script type="module" src="popup.js"></script>
  </body>
</html>
