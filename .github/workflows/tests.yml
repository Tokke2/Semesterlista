name: Tester

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Sätt upp Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Installera beroenden
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyflakes pymupdf

      - name: Kontrollera att versionen är synkad
        run: python tools/bump_version.py --check

      - name: Kör testsviten
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -v

      - name: Statisk kontroll (pyflakes)
        # core/init.py exporterar namn lazy via __getattr__ – pyflakes ser dem
        # inte och rapporterar falska "undefined name" för __all__.
        run: |
          python -m pyflakes $(git ls-files '*.py' '*.pyw' | grep -v '^core/init.py$')

  windows-runtime:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Testa startprogrammets Python-val utan installation
        shell: powershell
        run: ./tests/test_runtime_windows.ps1
