name: Tester

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
        os: [ubuntu-latest]
        include:
          - os: macos-latest
            python-version: "3.12"

    steps:
      - uses: actions/checkout@v4

      - name: Sätt upp Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Installera beroenden
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyflakes pymupdf

      - name: Kontrollera att versionen är synkad
        run: python tools/bump_version.py --check

      - name: Kör testsviten
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -v

      - name: Statisk kontroll (pyflakes)
        # core/init.py exporterar namn lazy via __getattr__ – pyflakes ser dem
        # inte och rapporterar falska "undefined name" för __all__.
        run: |
          python -m pyflakes $(git ls-files '*.py' '*.pyw' | grep -v '^core/init.py$')

  windows-runtime:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Testa startprogrammets Python-val utan installation
        shell: powershell
        run: |
          try { ./tests/test_runtime_windows.ps1 }
          catch { Write-Output "::error::$($_.Exception.Message)"; throw }

      - name: Testa reparation utan Qt eller paketinstallation
        shell: powershell
        run: |
          python -m unittest discover -s tests -p test_runtime_check.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Runtime repair tests failed' }

      - name: Testa en instans och aktivering med separata Windows-processer
        shell: powershell
        run: |
          python -m pip install PySide6-Essentials
          if ($LASTEXITCODE -ne 0) { throw 'Qt install for tests failed' }
          cmd /c "python -m unittest discover -s tests -p test_single_instance.py -v > single-instance-tests.log 2>&1"
          $testCode = $LASTEXITCODE
          $text = Get-Content single-instance-tests.log -Raw
          Write-Output $text
          if ($testCode -ne 0) {
            Write-Output ('::error::' + $text.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A'))
            throw 'Single-instance tests failed'
          }

      - name: Testa PDF-arkivering på Windows
        shell: powershell
        run: |
          python -m pip install reportlab
          if ($LASTEXITCODE -ne 0) { throw 'ReportLab install failed' }
          python -m unittest discover -s tests -p test_pdf_archive.py -v
          if ($LASTEXITCODE -ne 0) { throw 'PDF archive tests failed' }

      - name: Testa appmappen i systemfältsmenyn
        shell: powershell
        run: |
          python -m unittest discover -s tests -p test_tray_folder.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Tray folder tests failed' }
